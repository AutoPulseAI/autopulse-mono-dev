<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cache-control" content="no-store,max-age=0" />
    <meta name="robots" content="noindex" />
    <title>Autopulse AI</title>
    <link rel="icon" href="../assets/images/auto/favicon-auto.ico" type="image/ico">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700%7CRoboto:400,700" rel="stylesheet">
<style>
    :root {
    --chat_blue: #4272FF;
    --primary: #ff4605;
    --primary-light: rgb(255, 70, 5);
    --black: #0F141E;
    --dark: #222732;
    --dark-light: #2F3B48;
    --secondary: #99A1B2;
    --gray: #EFF3FA;
    --white: #ffffff;
    --border-color: rgba(52, 59, 74, 0.05);
    --red: #ff0000;
    --green: #198754;
    --card-icons: #a7a7a7;
    --tw: #1fbed6;
    --fb: #1877F2;
    --yb: #CD201F;
    --ln: #0077b5;
    --wh: #25d366;
    --yellow: #FFFAEC;
    --blue: #43a9e7;
    --brown: #964B00;
}
    * {
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        -webkit-text-size-adjust: 100%;
    }

    .testTai {
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 100%;
        background-image: url(../assets/images/autoai/bg.svg);
        background-position: center center;
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;
        background-color: var(--black);
    }
    .testTai::before {
    content: "";
    position: absolute;
    background-image: url(../assets/images/autoai/bgsq.svg);
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    width: 100%;
    height: 100%;
    opacity: 0.3;
}
.testTai_logo {
    width: 350px;
    margin: 0 auto;
}
.testTai_logo img {
    width: 100%;
}

@media (max-width: 600px){
    .testTai_logo {
        width: 220px;
        margin: 0 auto;
    }
}

</style>
</head>
<body>

    <div class="testTai">
        <div class="testTai_logo ravi">
            <img src="../assets/images/auto/logo-w.png" alt="img" class="mx-auto">
        </div>
    </div>
    <script src="https://chat.autopulse.ai/assets/js/shaddow.js?userid_id=930447c8-c7fa-45b3-8b27-0b531b23a417"></script>
    <!-- <script src="http://127.0.0.1:8000/assets/js/shaddow.js?userid_id=930447c8-c7fa-45b3-8b27-0b531b23a417"></script> -->
</body>
</html>
