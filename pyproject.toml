[project]
name = "upsell-agent"
version = "0.1.0"
description = "AutoPulse agentic upsell layer: LangGraph orchestration + Pydantic AI typed outputs, grounded against real inventory/pricing/customer data."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # Agent orchestration + durable state/memory.
    # Pinned rather than left loose: langgraph and langchain-core version skew
    # is a real, observed failure mode (a mismatched pair raises
    # ModuleNotFoundError deep in langgraph_sdk's import chain at startup,
    # not a clear dependency error) - verified against this exact pair
    # resolving cleanly together in an isolated venv.
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-redis>=0.5,<0.6",

    # Typed, validated model output (anti-hallucination contract)
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai>=0.0.14",

    # Data access — same stores aidmvcs-be-dev already runs
    "motor>=3.6",           # async MongoDB driver
    "redis[hiredis]>=5.2",

    # HTTP client for calling the existing Next.js API / other tools
    "httpx>=0.27",

    # Observability
    "langfuse>=2.53",

    # Config / env
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "deepeval>=2.0",         # evals / hallucination test gate
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upsell_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"
