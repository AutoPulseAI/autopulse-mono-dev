name: Deploy to AWS
on:
  push:
    branches: [main]
  workflow_dispatch:   # "Run workflow" button: deploys both apps

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Server layout (7 Oct 2026):
#   /var/www/html/autopulse-prod-v2/aidmvcs-be-dev        live CRM (PM2 aidmvcs-be-v2 on :3001, aidmvcs-worker-v2);
#                                                         nginx serves /_next/static from its .next/static
#   /var/www/html/autopulse-prod-v2/aidmvcs-be-dev.build  where the CRM is built, so the live site keeps serving
#                                                         during the build
#   /var/www/html/autopulse-prod-v2/agentic-upsell        AI service (PM2 agentic-upsell on 127.0.0.1:8100,
#                                                         agentic-worker); Python env in venv/
# PM2 runs under PM2_HOME=/home/ubuntu/.pm2 (a session's HOME can be /tmp on this box, so it is always explicit).

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes
      TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
      ROOT: /var/www/html/autopulse-prod-v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect which app(s) changed
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED="aidmvcs-be-dev/ agentic-upsell/"   # manual run, new branch or unknown base: deploy both
          else
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          fi
          echo "core=$(echo "$CHANGED" | grep -q '^aidmvcs-be-dev/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "upsell=$(echo "$CHANGED" | grep -q '^agentic-upsell/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" | sed 's#/.*##' | sort -u

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy aidmvcs-be-dev (build aside, then swap)
        if: steps.changes.outputs.core == 'true'
        run: |
          rsync -az --delete -e "$SSH" \
            --exclude='.env*' --exclude='node_modules' --exclude='.next' --exclude='logs' \
            aidmvcs-be-dev/ "$TARGET:$ROOT/aidmvcs-be-dev.build/"
          $SSH "$TARGET" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PM2_HOME=/home/ubuntu/.pm2
          ROOT=/var/www/html/autopulse-prod-v2; APP=$ROOT/aidmvcs-be-dev; BUILD=$ROOT/aidmvcs-be-dev.build

          # 1. Build next to the live app with the live app's settings; the site keeps serving meanwhile.
          cp -p "$APP"/.env* "$BUILD"/ 2>/dev/null || true
          cd "$BUILD"
          npm ci --no-audit --no-fund
          rm -rf .next
          npm run build

          # 2. Keep the previous build's JS/CSS, so pages already open in a browser still find their files.
          rsync -a --ignore-existing "$APP/.next/static/" "$BUILD/.next/static/"

          # 3. Swap in: code and packages, then the build (one rename), then restart.
          rsync -a --delete --exclude='.env*' --exclude='node_modules' --exclude='.next' --exclude='logs' "$BUILD/" "$APP/"
          rsync -a --delete "$BUILD/node_modules/" "$APP/node_modules/"
          rm -rf "$APP/.next.new" "$APP/.next.prev"
          cp -a "$BUILD/.next" "$APP/.next.new"
          mv "$APP/.next" "$APP/.next.prev"
          mv "$APP/.next.new" "$APP/.next"
          pm2 restart aidmvcs-be-v2 aidmvcs-worker-v2 --update-env

          # 4. The site must answer and every JS/CSS file its login page lists must exist; otherwise roll back.
          ok=false
          for i in $(seq 1 30); do
            if curl -sf -o /tmp/deploy-page.html http://127.0.0.1:3001/dealer; then ok=true; break; fi
            sleep 2
          done
          if $ok; then
            for f in $(grep -oE '/_next/static/[^"]+\.(js|css)' /tmp/deploy-page.html | sort -u); do
              [ -f "$APP/.next/static/${f#/_next/static/}" ] || { echo "missing $f"; ok=false; }
            done
          fi
          if ! $ok; then
            echo "Deploy check failed: rolling back to the previous build"
            rm -rf "$APP/.next.failed"; mv "$APP/.next" "$APP/.next.failed"; mv "$APP/.next.prev" "$APP/.next"
            pm2 restart aidmvcs-be-v2 aidmvcs-worker-v2 --update-env
            exit 1
          fi
          pm2 save
          echo "CRM deployed"
          REMOTE

      - name: Deploy agentic-upsell
        if: steps.changes.outputs.upsell == 'true'
        run: |
          rsync -az --delete -e "$SSH" \
            --exclude='.env*' --exclude='venv' --exclude='.venv' --exclude='__pycache__' --exclude='*.egg-info' \
            agentic-upsell/ "$TARGET:$ROOT/agentic-upsell/"
          $SSH "$TARGET" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PM2_HOME=/home/ubuntu/.pm2
          cd /var/www/html/autopulse-prod-v2/agentic-upsell
          venv/bin/pip install -q -e .
          pm2 restart agentic-upsell agentic-worker --update-env
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8100/health >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8100/health >/dev/null || { echo "AI service did not come back"; pm2 logs agentic-upsell --lines 40 --nostream; exit 1; }
          pm2 save
          echo "AI service deployed"
          REMOTE

      - name: Smoke test through Cloudflare
        run: |
          sleep 5
          curl -sf -o page.html https://www.autopulse.ai/dealer
          bad=0
          for f in $(grep -oE '/_next/static/[^"]+\.(js|css)' page.html | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.autopulse.ai$f")
            [ "$code" = 200 ] || { echo "$code $f"; bad=$((bad+1)); }
          done
          echo "files failing: $bad"
          [ "$bad" = 0 ]
          $SSH "$TARGET" 'PM2_HOME=/home/ubuntu/.pm2 pm2 status'
