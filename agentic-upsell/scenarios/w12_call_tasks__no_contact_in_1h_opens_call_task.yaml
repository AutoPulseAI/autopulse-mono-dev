name: No staff call task just because a touch got no reply in an hour
description: 'Client, 10 Oct 2026 (it made hundreds of alerts): a text / email with no reply within 60 minutes does NOT open a staff call task (CALL_TASK_ON_NO_REPLY off). The Days 1-7 call tasks and a call the customer asks for still do (w12_call_tasks__days_1_to_7_call_tasks_planned, w12_staff__speak_to_a_human_call_or_text).'
steps:
  - advance_clock: {dealer: A, to: "Tue 10:00"}
  - new_lead: {as: c, dealer: A, lead_type: sales, channel: sms, name: Cal Callme, comments: "Interested in a 2023 Toyota Camry"}
  - wait_turns: {lead: c, count: 1, timeout_s: 20}
  - expect_no_followup: {lead: c, kind: call_task, settle_s: 2}
  - advance_clock: {minutes: 65}
  - expect_call_task: {lead: c, status: none}
