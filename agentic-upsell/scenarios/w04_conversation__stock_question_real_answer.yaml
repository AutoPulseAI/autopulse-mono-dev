name: A stock question is answered from real stock, or an honest promise
description: >
  Dealer B has one Toyota RAV4. "Do you have a Toyota RAV4?" gets an answer naming that real vehicle (Phase
  3) and the guard never rejects it for inventing anything about the vehicle (the grounding check, Phase 4,
  is satisfied by construction - a real model occasionally still needs its one allowed rewrite for an
  unrelated rule, like asking one question too many). A second lead asks about a Ford Mustang the dealer
  doesn't have:
  the reply is never a bare "no" - it keeps things moving (a promise to follow up, or a question about what
  else might work) rather than a dead end (decision D; blueprint §4 "positive outcomes only"). The exact
  wording is the AI's own - a question, a promise to check with the team, or both are all genuine "not a
  dead end" - so what's checked is the structural fact: the guard passed it and it was actually sent.
steps:
  - advance_clock: {dealer: B, to: "Tue 10:00"}
  - add_stock:
      as: rav4
      dealer: B
      vehicles:
        - {year: 2022, make: Toyota, model: RAV4, trim: LE, body: SUV, condition: used, color: White, miles: 21000}

  - new_lead: {as: h, dealer: B, lead_type: sales, channel: sms, name: Hank Hasit, comments: "Hi, I saw your ad"}
  - wait_turns: {lead: h, count: 1, timeout_s: 20}
  - reply: {lead: h, text: "Do you have a Toyota RAV4?"}
  - wait_turns: {lead: h, count: 2, timeout_s: 20}
  - expect_last_sent: {lead: h, contains: "RAV4"}
  - expect_turn: {lead: h, ran: [send], not_ran: [fallback]}

  - new_lead: {as: n, dealer: B, lead_type: sales, channel: sms, name: Nora Nomatch, comments: "Hi, I saw your ad"}
  - wait_turns: {lead: n, count: 1, timeout_s: 20}
  - reply: {lead: n, text: "Do you have a Ford Mustang?"}
  - wait_turns: {lead: n, count: 2, timeout_s: 20}
  - expect_turn: {lead: n, ran: [send], not_ran: [fallback]}
