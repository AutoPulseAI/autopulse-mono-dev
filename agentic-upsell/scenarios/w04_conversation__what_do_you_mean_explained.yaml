name: '"What do you mean?" gets the same question explained'
description: >
  The AI asks about the trade-in's condition; the customer asks what that means. The reply explains it in
  plain words and asks the same question again, nothing new, and the customer's answer then fills it.
  [KNOWN GAP, found 6 Oct 2026 against gpt-5-mini] the clarify message correctly re-asks condition alongside
  the owe-money question; a bare one-word "good" reply afterward is sometimes read as a generic
  acknowledgment rather than the condition answer, and the next message re-asks instead of filling the slot -
  the offline model never misreads this since it's scripted. Left failing on purpose rather than hidden: a
  real Extract gap with a short, ambiguous reply to a two-question message, not a test problem.
steps:
  - advance_clock: {dealer: A, to: "Tue 10:00"}
  # Inside opening hours whatever day it really is: after hours the first reply is the "now or when we open?" offer.
  - advance_clock: {dealer: A, to: "Tue 10:00"}
  - new_lead: {as: c, dealer: A, lead_type: trade_in, channel: sms, name: Cal Clarify, comments: "Trading my 2018 Honda Civic with 60,000 miles"}
  - wait_turns: {lead: c, count: 1, timeout_s: 20}
  - expect_last_sent: {lead: c, contains_any: ["excellent, good, fair or poor", "excellent, good, fair, or poor"], question_marks: 2}
  - reply: {lead: c, text: "what do you mean?"}
  - wait_turns: {lead: c, count: 2, timeout_s: 20}
  # Decide marking this "clarify" (not a fresh ask) is the structural proof nothing new was introduced; the
  # explanation itself and exactly how it's worded are the AI's own, many true ways to say it. The real proof
  # it worked is the last step: the customer's plain answer fills the same slot the first question asked for.
  - expect_turn: {lead: c, outcome: clarify}
  - expect_last_sent: {lead: c, contains_any: ["looks and runs like new", "runs like new", "small signs of use", "condition"]}
  - reply: {lead: c, text: "good"}
  - wait_turns: {lead: c, count: 3, timeout_s: 20}
  - expect_slots: {lead: c, filled: [trade_in.condition], values: {trade_in.condition: good}}
