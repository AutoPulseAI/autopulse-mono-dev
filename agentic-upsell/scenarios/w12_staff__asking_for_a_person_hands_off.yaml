name: Asking for a person hands off
description: When the customer asks for a real person, Decide fires the hand-off rule.
steps:
  - advance_clock: {dealer: B, to: "Tue 10:00"}
  - new_lead: {as: h, dealer: B, lead_type: sales, channel: sms, name: Handoff Scenario, comments: "Interested in a used truck"}
