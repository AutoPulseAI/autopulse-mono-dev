name: After hours, the team picks it up when the dealership opens
description: 'MASTER_PLAN_3 B1. A website lead at 19:30 (the dealer is closed, and it is still inside the customer''s 8:00-21:00 texting hours) is offered the choice and says "tomorrow is fine": a short thank-you with no questions, and a morning message due at 9:00 (the dealer opens, and it is 8:00+ in the customer''s New York time). At 9:00 the morning message goes out ("the team is in now", then the next questions), the choice becomes "now", and the team gets a notice. A lead at 23:00 is outside the texting hours: nothing is texted at night, and the first reply waits for 8:00 (PLAN_4 stream X1 item 1; blueprint box 0 "if within TCPA allowed hours").'
steps:
  - advance_clock: {dealer: A, to: "Tue 19:30"}
  - new_lead: {as: l, dealer: A, lead_type: sales, channel: sms, name: Leo Later, comments: "Hi, I want a new Toyota RAV4", send_event: false}
  - set_contact: {lead: l, zip: "10001"}
  - send_lead_created: {lead: l}
  - wait_turns: {lead: l, count: 1, timeout_s: 20}
  - expect_last_sent: {lead: l, contains: "Tell me, what are you driving now?", question_marks: 2}
  - expect_lead: {lead: l, after_hours: offered}
  - reply: {lead: l, text: "tomorrow is fine"}
  - wait_turns: {lead: l, count: 2, timeout_s: 20}
  - expect_last_sent: {lead: l, contains: "9:00", question_marks: 0}
  - expect_lead: {lead: l, after_hours: later}
  - expect_followup: {lead: l, kind: resume_at_opening, status: pending, due_local: "09:00"}

  - advance_clock: {dealer: A, to: "Tue 23:00"}
  - new_lead: {as: n, dealer: A, lead_type: sales, channel: sms, name: Nora Night, comments: "Hi, I want a new Toyota RAV4", send_event: false}
  - set_contact: {lead: n, zip: "10001"}
  - send_lead_created: {lead: n}
  - expect_followup: {lead: n, kind: first_reply_held, status: pending, due_local: "08:00", timeout_s: 20}
  - expect_outbox: {lead: n, channel: sms, count: 0}
  - expect_outbox: {lead: n, channel: email, count: 0}

  - advance_clock: {dealer: A, to: "Wed 09:01"}
  - expect_followup: {lead: l, kind: resume_at_opening, status: sent, timeout_s: 30}
  - expect_outbox: {lead: l, channel: sms, count: 3, contains: "team is in"}
  - expect_lead: {lead: l, after_hours: now, staff_notice: after_hours_resume}
  - expect_followup: {lead: n, kind: first_reply_held, status: sent, timeout_s: 30}
  - expect_outbox: {lead: n, channel: sms, count: 1}
