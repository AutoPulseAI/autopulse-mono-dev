name: '"Not yet" parks the visit offer and the conversation carries on'
description: 'MASTER_PLAN_3 B4 item 4. A decline is recorded (attempt 1 of 3) and the offer is parked for 3 replies; the next reply answers without offering again. After a 3rd decline the offer stops and a dated visit_followup is scheduled (unit-tested in test_booking_flow.py).'
steps:
  - advance_clock: {dealer: A, to: "Tue 12:00"}
  - new_lead: {as: d, dealer: A, lead_type: sales, channel: sms, name: Dan Decline, comments: "Hi, I want a new Toyota RAV4", send_event: false}
  - set_contact: {lead: d, zip: "10001"}
  - send_lead_created: {lead: d}
  - wait_turns: {lead: d, count: 1, timeout_s: 20}
  - reply: {lead: d, text: "My budget is $35,000 and I'd like to buy this month"}
  - wait_turns: {lead: d, count: 2, timeout_s: 20}
  - expect_turn: {lead: d, outcome: offer_visit}
  - reply: {lead: d, text: "not right now, I'm busy"}
  - wait_turns: {lead: d, count: 3, timeout_s: 20}
  - expect_lead: {lead: d, visit_attempts: 1, visit_declined: true}
  - reply: {lead: d, text: "does it come in blue?"}
  - wait_turns: {lead: d, count: 4, timeout_s: 20}
  - expect_lead: {lead: d, visit_attempts: 1, visit_declined: true}
