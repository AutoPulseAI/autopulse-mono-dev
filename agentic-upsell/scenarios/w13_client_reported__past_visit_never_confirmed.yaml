name: A visit in the past is never confirmed as "you're all set"
description: 'Live, 20 Oct 2026 (Sadhana): a follow-up said "You are all set for Thursday, October 15" five days after it. A booking whose time has passed no longer counts as the active visit.'
steps:
  - advance_clock: {dealer: A, to: "Tue 10:00"}
  - new_lead: {as: p, dealer: A, lead_type: sales, channel: sms, name: Sadie Past, comments: "Interested in a 2022 Honda CR-V"}
  - wait_turns: {lead: p, count: 1, timeout_s: 20}
  - staff_status: {lead: p, status: "Appointment Booked", booking_in_days: -5}
  - reply: {lead: p, text: "Yeah"}
  - wait_turns: {lead: p, count: 2, timeout_s: 20}
  - expect_last_sent: {lead: p, excludes: "all set for"}
