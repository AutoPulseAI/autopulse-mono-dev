name: No white RAV4, so the search loosens colour
description: Dealer B has one RAV4, in silver. A lead asks for a used white Toyota RAV4. Search stock runs on the first turn (after Extract), reads the dealer's own colour spellings, finds no white one, loosens colour and loads the silver RAV4. The trace records the colour step. A follow-up in red is corrected to the dealer's own "RED" spelling before it's sent.
steps:
  - add_stock:
      as: silver
      dealer: B
      vehicles:
        - {year: 2022, make: Toyota, model: RAV4, trim: XLE, body: SUV, condition: used, color: Silver, miles: 26000}
  - add_stock:
      as: red
      dealer: B
      vehicles:
        - {year: 2021, make: Toyota, model: RAV4, trim: LE, body: SUV, condition: used, color: RED, miles: 41000}
  - new_lead: {as: w, dealer: B, lead_type: sales, channel: sms, name: Wren White, comments: "Do you have a used white Toyota RAV4?"}
  - wait_turns: {lead: w, count: 1, timeout_s: 20}
  - expect_inventory: {lead: w, searched: true, trigger: "asked about stock", query: {make: Toyota, model: RAV4, condition: used, exterior_color: white}, loosened: [colour], loaded_include: silver, min_loaded: 2}
  - reply: {lead: w, text: "Red would be great too"}
  - wait_turns: {lead: w, count: 2, timeout_s: 20}
  - expect_inventory: {lead: w, searched: true, loosened: [], colour_sent: RED, only_loaded: red, min_loaded: 1}
