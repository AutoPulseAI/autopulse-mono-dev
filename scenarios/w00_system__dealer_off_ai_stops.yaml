name: Rolling a dealer back to off stops the AI
description: Rollback is setting the dealer to off. The platform stops sending events (the customer's reply never reaches the AI), and the AI's pending follow-up is cancelled when it comes due instead of being sent.
steps:
  # Inside opening hours whatever day it really is (on a Sunday the nudge waited for Monday and never fell due).
  - advance_clock: {dealer: A, to: "Tue 10:00"}
  - new_lead: {as: r, dealer: A, lead_type: sales, channel: sms, name: Rory Rollback, comments: "Looking at a used Civic"}
  - wait_turns: {lead: r, count: 1, timeout_s: 15}
  - expect_followup: {lead: r, kind: cadence_touch, status: pending}
  - set_dealer_mode: {dealer: A, mode: "off"}
  - reply: {lead: r, text: "Is it still there?"}
  - expect_turn_count: {lead: r, count: 1, settle_s: 2}
  - advance_clock: {hours: 3.1}
  - expect_followup: {lead: r, kind: cadence_touch, status: cancelled, timeout_s: 20}
  - expect_outbox: {lead: r, channel: email, count: 0}
