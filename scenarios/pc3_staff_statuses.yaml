name: Staff statuses move the lead's stage
stage: 303
description: Staff setting "Appointment Booked" on the platform moves the lead to Appointment Set and does NOT pause the AI (it runs the appointment workflow for staff bookings too, decided 1 Oct 2026). "Visited" moves it to Sales Visit and pauses it, with every pending follow-up cancelled.
steps:
  - advance_clock: {dealer: A, to: "Tue 10:00"}
  - new_lead: {as: s, dealer: A, lead_type: sales, channel: sms, name: Sam Staffstatus, comments: "Looking at a new Camry"}
  - wait_turns: {lead: s, count: 1, timeout_s: 20}
  - staff_status: {lead: s, status: "Appointment Booked", booking_in_days: 2}
  - expect_lead: {lead: s, stage: appointment_set, status: active}
  - expect_no_followup: {lead: s, kind: channel_switch, status: pending}
  - staff_status: {lead: s, status: "Visited"}
  - expect_lead: {lead: s, stage: sales_visit, status: paused}
  - expect_no_followup: {lead: s, kind: any, status: pending}
