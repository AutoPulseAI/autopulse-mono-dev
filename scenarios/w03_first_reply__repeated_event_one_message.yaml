name: A repeated event sends one message
description: The platform sending the same new-lead event twice produces exactly one message to the customer.
steps:
  - new_lead: {as: d, dealer: A, lead_type: service, channel: sms, name: Dana Scenario, comments: "Brakes squeaking", send_event: false}
  - send_lead_created: {lead: d, expect: queued}
  - send_lead_created: {lead: d, expect: duplicate}
  - wait_turns: {lead: d, count: 1, timeout_s: 15}
  - expect_messages: {lead: d, direction: outbound, count: 1, settle_s: 2}
