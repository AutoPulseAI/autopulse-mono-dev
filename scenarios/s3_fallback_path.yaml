name: Second guard failure uses the template
stage: 3
description: Every draft fails the guard, so after one rewrite the fallback template is used.
steps:
  - new_lead: {as: f, dealer: B, lead_type: general, channel: sms, name: Fallback Scenario, comments: "hello"}
  - wait_turns: {lead: f, count: 1, timeout_s: 30}
  - reply: {lead: f, text: "hello again #fallback"}
  - wait_turns: {lead: f, count: 2, timeout_s: 30}
  - expect_turn: {lead: f, outcome: fallback, attempts: {compose: 2}, ran: [fallback, send]}
