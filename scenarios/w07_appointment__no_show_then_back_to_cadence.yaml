name: No show, follow-up, then back to follow-up
stage: 305
description: 'MASTER_PLAN_3 C5 (Omnichannel PDF §9). No visit by appointment time + 1 hour makes the lead No Show and sends the showroom message on text and email; 24h later the "how did it go" message; 24h after that it returns to Contact Made - No Next Action with a fresh cadence (no introduction, no name nudge).'
steps:
  - advance_clock: {dealer: A, to: "Tue 12:00"}
  - new_lead: {as: v, dealer: A, lead_type: sales, channel: sms, name: Nick Noshow, comments: "Hi, I want a new Toyota RAV4", send_event: false}
  - set_contact: {lead: v, zip: "10001"}
  - send_lead_created: {lead: v}
  - wait_turns: {lead: v, count: 1, timeout_s: 20}
  - reply: {lead: v, text: "My budget is $35,000 and I'd like to buy this month"}
  - wait_turns: {lead: v, count: 2, timeout_s: 20}
  - reply: {lead: v, text: "Can I come Thursday at 10 AM?"}
  - wait_turns: {lead: v, count: 3, timeout_s: 20}
  - expect_booking: {lead: v, status: pending, time: "10:00"}
  - expect_followup: {lead: v, kind: appointment_no_show_check, status: pending, due_local: "11:00"}
  - advance_clock: {dealer: A, to: "Wed 10:05"}
  - expect_followup: {lead: v, kind: appointment_confirm, status: sent, timeout_s: 30}
  - advance_clock: {dealer: A, to: "Thu 11:05"}
  - expect_followup: {lead: v, kind: appointment_no_show_check, status: sent, timeout_s: 30}
  - expect_lead: {lead: v, stage: appointment_no_show}
  - expect_last_sent: {lead: v, contains: "I am looking for you in the showroom"}
  - advance_clock: {hours: 25}
  - expect_followup: {lead: v, kind: appointment_no_show_followup, status: sent, timeout_s: 30}
  - expect_last_sent: {lead: v, contains: "Did you get a chance to stop by?"}
  - advance_clock: {hours: 25}
  - expect_followup: {lead: v, kind: appointment_no_show_close, status: sent, timeout_s: 30}
  - expect_lead: {lead: v, stage: contact_made_no_next_action, status: active}
