name: A question mid-flow is answered, then one ask
stage: 105
description: 'The rigid loop from manual testing: the AI had asked for a detail and the customer asks "so far what do u know about me?". The reply answers from the profile first, then asks exactly one thing.'
steps:
  - new_lead: {as: a, dealer: A, lead_type: sales, channel: sms, name: Ana Answer, comments: "Interested in a used Ford F-150"}
  - wait_turns: {lead: a, count: 1, timeout_s: 20}
  - reply: {lead: a, text: "so far what do u know about me?"}
  - wait_turns: {lead: a, count: 2, timeout_s: 20}
  - expect_turn: {lead: a, outcome: answer}
  - expect_last_sent: {lead: a, contains: "Here's what I have so far", question_marks: 1}
  - expect_context: {lead: a, index: -1, open_questions: []}
  - reply: {lead: a, text: "ok"}
  - wait_turns: {lead: a, count: 3, timeout_s: 20}
  - expect_context: {lead: a, index: -1, open_questions: []}
