name: '"Not interested" gets one "why?", then a person decides'
description: '"Not interested" is an objection, not an opt-out (client, 1 Oct 2026). The AI asks why once, gently, with no visit offer. When the customer gives a reason, it''s noted and the lead goes to a person. Only staff may close it as lost, so the stage stays open.'
steps:
  - advance_clock: {dealer: A, to: "Tue 10:00"}
  - new_lead: {as: i, dealer: A, lead_type: sales, channel: sms, name: Ivy Notinterested, comments: "Price on the Tacoma?"}
  - wait_turns: {lead: i, count: 1, timeout_s: 20}
  - reply: {lead: i, text: "I'm not interested anymore"}
  - wait_turns: {lead: i, count: 2, timeout_s: 20}
  - expect_turn: {lead: i, outcome: ask_why}
  - expect_last_sent: {lead: i, contains: "what changed", question_marks: 1}
  - reply: {lead: i, text: "Bought one elsewhere last week"}
  - wait_turns: {lead: i, count: 3, timeout_s: 20}
  - expect_lead: {lead: i, status: handoff, stage: contact_made_no_next_action}
