name: Replying first cancels the channel switch
stage: 10
description: The customer answers the SMS before 24 hours are up, so the email follow-up is cancelled. The AI's answer to the reply gets its own new follow-up.
steps:
  - new_lead: {as: r, dealer: A, lead_type: sales, channel: sms, name: Rita Reply, comments: "Interested in a used Honda CR-V"}
  - wait_turns: {lead: r, count: 1, timeout_s: 15}
  - expect_followup: {lead: r, status: pending, to_channel: email}
  - advance_clock: {hours: 23}
  - reply: {lead: r, text: "My budget is about $25k"}
  - wait_turns: {lead: r, count: 2, timeout_s: 15}
  - expect_followup: {lead: r, index: 0, status: cancelled}
  - expect_followup: {lead: r, index: -1, status: pending, count: 2}
  - expect_outbox: {lead: r, channel: email, count: 0}
