name: A lead form that says no is never texted; everything goes by email
description: MASTER_PLAN_3 B3 (built in C1); PLAN_4 stream X1 item 1. An AutoTrader lead with "TCPAOptIn false" gets no text at all - the first message on a lead is a lead response, not a reply, so the form's explicit no applies to it - and its first reply goes by email instead. The cadence then carries on by email alone - the text half of each touch is blocked (Omnichannel PDF p.10, "continue every remaining permitted channel") - and never sends a marketing text.
steps:
  - advance_clock: {dealer: A, to: "Tue 12:00"}
  - new_lead: {as: texted, dealer: A, lead_type: sales, channel: sms, name: Tia Nooptin, comments: "TCPAOptIn: false; Looking for a used CR-V", send_event: false}
  - set_contact: {lead: texted, source: AutoTrader, zip: "10001"}
  - send_lead_created: {lead: texted}
  - wait_turns: {lead: texted, count: 1, timeout_s: 20}
  - expect_outbox: {lead: texted, channel: sms, count: 0}
  - expect_outbox: {lead: texted, channel: email, count: 1}
  - expect_followup: {lead: texted, kind: cadence_touch, status: pending}
  - advance_clock: {hours: 3.1}
  - expect_followup: {lead: texted, kind: cadence_touch, status: sent, index: 0, timeout_s: 30}
  - expect_outbox: {lead: texted, channel: sms, count: 0}
  - expect_outbox: {lead: texted, channel: email, count: 2}

  - new_lead: {as: emailed, dealer: A, lead_type: sales, channel: email, name: Eli Nooptin, comments: "TCPAOptIn: false; Looking for a used CR-V", send_event: false}
  - set_contact: {lead: emailed, source: AutoTrader, zip: "10001"}
  - send_lead_created: {lead: emailed}
  - wait_turns: {lead: emailed, count: 1, timeout_s: 20}
  - expect_outbox: {lead: emailed, channel: email, count: 1}
  - expect_outbox: {lead: emailed, channel: sms, count: 0}
  - expect_followup: {lead: emailed, kind: cadence_touch, status: pending}
