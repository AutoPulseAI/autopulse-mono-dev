name: '"Never contact me again" stops every channel; staff DND does too'
description: 'Scope Workflow 11, opt-out. A phrase that names no channel stops them all: one plain confirmation, the lead becomes Opted Out / Suppressed and nothing more is scheduled. Staff setting the status DND does the same for another lead.'
steps:
  - advance_clock: {dealer: A, to: "Tue 10:00"}
  - new_lead: {as: n, dealer: A, lead_type: sales, channel: sms, name: Nev Never, comments: "Interested in a 2023 Toyota Camry"}
  - wait_turns: {lead: n, count: 1, timeout_s: 20}
  - expect_followup: {lead: n, kind: cadence_touch, status: pending}
  - reply: {lead: n, text: "Please never contact me again"}
  - wait_turns: {lead: n, count: 2, timeout_s: 20}
  - expect_turn: {lead: n, trigger: inbound_held, outcome: opt_out_confirmation}
  - expect_lead: {lead: n, stage: opted_out, timeout_s: 20}
  - expect_no_followup: {lead: n, kind: cadence_touch, status: pending}
  - advance_clock: {hours: 30}
  - expect_outbox: {lead: n, channel: sms, count: 2}
  - expect_outbox: {lead: n, channel: email, count: 0}

  - new_lead: {as: d, dealer: A, lead_type: sales, channel: sms, name: Dee Dnd, comments: "Interested in a 2023 Toyota Camry"}
  - wait_turns: {lead: d, count: 1, timeout_s: 20}
  - staff_status: {lead: d, status: "DND"}
  - expect_lead: {lead: d, stage: opted_out, timeout_s: 20}
  - expect_no_followup: {lead: d, kind: cadence_touch, status: pending}
