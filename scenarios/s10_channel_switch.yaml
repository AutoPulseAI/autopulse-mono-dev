name: No reply for 24h switches SMS to email
stage: 10
description: The AI's first SMS gets no answer, so after 24 hours the email version of the same message goes out, once. Nothing is scheduled after that.
steps:
  - new_lead: {as: n, dealer: A, lead_type: sales, channel: sms, name: Nora Switch, comments: "Looking at a new Toyota RAV4"}
  - wait_turns: {lead: n, count: 1, timeout_s: 15}
  - expect_followup: {lead: n, status: pending, to_channel: email, count: 1}
  - expect_outbox: {lead: n, channel: email, count: 0, settle_s: 0}
  - advance_clock: {hours: 24.1}
  - expect_followup: {lead: n, status: sent, to_channel: email, count: 1, timeout_s: 20}
  - expect_outbox: {lead: n, channel: email, count: 1, contains: "Hi Nora"}
  - expect_turn: {lead: n, index: -1, outcome: followup_sent, nodes: [followup, send]}
  - advance_clock: {hours: 48}
  - expect_outbox: {lead: n, channel: sms, count: 1, settle_s: 3}
  - expect_followup: {lead: n, status: sent, count: 1}
