name: A shadow dealer's leads get drafts, never messages
description: Dealer C is in shadow mode. The AI runs every turn and stores its draft as "shadow", but nothing is sent, nothing is recorded in the dealer's conversation, and no follow-up is scheduled. Each draft is shown next to what n8n actually sent.
steps:
  - new_lead: {as: s, dealer: C, lead_type: sales, channel: sms, name: Shay Shadow, comments: "Is the Tacoma still available?"}
  - wait_turns: {lead: s, count: 1, timeout_s: 15}
  - platform_reply: {lead: s, text: "Hi Shay! Yes, come by any time. (n8n)", by: n8n}
  - reply: {lead: s, text: "Great, do you have the TRD Off-Road?"}
  - wait_turns: {lead: s, count: 2, timeout_s: 15}
  - platform_reply: {lead: s, text: "Sam here - I'll check and call you.", by: staff}
  - expect_messages: {lead: s, direction: outbound, status: shadow, count: 2}
  - expect_outbox: {lead: s, channel: sms, count: 0}
  - expect_no_followup: {lead: s}
  - expect_shadow: {lead: s, drafts: 2, with_actual: 2}
