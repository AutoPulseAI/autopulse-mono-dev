name: A campaign text needs consent; the send check answers the campaign worker
stage: 301
description: MASTER_PLAN_3 B3 (built in C1), decision 66; PLAN_4 stream X1 items 4 and 8. The platform's campaign worker asks the send check through the shared queue. A DealerVault contact with no text consent is blocked (the report shows "Blocked"). The CRM's "SMS opt-in" flag alone is also blocked - the CRM sets it on any inbound text, so it is not consent to campaigns. Recorded consent is allowed - a lead provider's complete consent record (the disclosure, its version, the time, the phone), or the customer's own opt-in (START after a STOP). A lead-form "TCPAOptIn true" alone needs review. An allowed campaign at 21:00 is held to the next allowed time.
steps:
  - advance_clock: {dealer: A, to: "Tue 12:00"}
  - new_lead: {as: none, dealer: A, lead_type: sales, channel: sms, name: Nell Noconsent, comments: "", send_event: false}
  - set_contact: {lead: none, source: "", dealervault: true, sms_opt_in: null, zip: "10001"}
  - campaign_check: {lead: none, expect: BLOCK, reason_contains: "no text consent"}

  - new_lead: {as: flag, dealer: A, lead_type: sales, channel: sms, name: Fay Flagonly, comments: "", send_event: false}
  - set_contact: {lead: flag, source: "", dealervault: true, sms_opt_in: true, zip: "10001"}
  - campaign_check: {lead: flag, expect: BLOCK, reason_contains: "no text consent"}

  - new_lead: {as: yes, dealer: A, lead_type: sales, channel: sms, name: Yuri Optin, comments: "", send_event: false}
  - set_contact: {lead: yes, source: "", dealervault: true, sms_opt_in: null, zip: "10001", consent_record: true}
  - campaign_check: {lead: yes, expect: ALLOW}

  - new_lead: {as: back, dealer: A, lead_type: sales, channel: sms, name: Stella Start, comments: "", send_event: false}
  - set_contact: {lead: back, source: "", dealervault: true, sms_opt_in: null, zip: "10001"}
  - reply: {lead: back, text: "STOP"}
  - wait_turns: {lead: back, count: 1, timeout_s: 20}
  - campaign_check: {lead: back, expect: BLOCK, reason_contains: "opt"}
  - reply: {lead: back, text: "START"}
  - wait_turns: {lead: back, count: 2, timeout_s: 20}
  - campaign_check: {lead: back, expect: ALLOW}

  - new_lead: {as: form, dealer: A, lead_type: sales, channel: sms, name: Fern Form, comments: "", send_event: false}
  - set_contact: {lead: form, source: "", dealervault: true, sms_opt_in: null, zip: "10001", comments: "TCPAOptIn: true; wants a truck"}
  - campaign_check: {lead: form, expect: REVIEW, reason_contains: "CONSENT_REVIEW_REQUIRED"}

  - advance_clock: {hours: 9}
  - campaign_check: {lead: yes, expect: HOLD, until_local: "09:00"}
