name: Picking an offered time books the visit
description: 'MASTER_PLAN_3 B5. An offer, then "the second one": a pending booking is created on the platform (the dev stub writes it like POST /api/booking), the reply says it is requested and the team will confirm (never "booked" while pending), the team gets a notice, and the AI is not paused.'
steps:
  - advance_clock: {dealer: A, to: "Tue 12:00"}
  - new_lead: {as: v, dealer: A, lead_type: sales, channel: sms, name: Vic Visit, comments: "Hi, I want a new Toyota RAV4", send_event: false}
  - set_contact: {lead: v, zip: "10001"}
  - send_lead_created: {lead: v}
  - wait_turns: {lead: v, count: 1, timeout_s: 20}
  - reply: {lead: v, text: "My budget is $35,000 and I'd like to buy this month"}
  - wait_turns: {lead: v, count: 2, timeout_s: 20}
  - expect_turn: {lead: v, outcome: offer_visit}
  - reply: {lead: v, text: "the second one works"}
  - wait_turns: {lead: v, count: 3, timeout_s: 20}
  - expect_booking: {lead: v, status: pending}
  - expect_last_sent: {lead: v, contains: "requested"}
  - expect_lead: {lead: v, staff_notice: visit_booked}
  - reply: {lead: v, text: "what should I bring?"}
  - wait_turns: {lead: v, count: 4, timeout_s: 20}
  - expect_lead: {lead: v, status: active}
